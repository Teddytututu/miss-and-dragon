<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1850" role="img" aria-labelledby="title desc"><title id="title">Miss &amp; Dragon — Human in the loop</title><desc id="desc">Three responsibility layers. Separate research and recovery loops, each with its own return rail.</desc><style>svg{--paper:#fffaf4;--ink:#293f52;--muted:#526b7e;--line:#b8cbd8;--accent:#326383;--wash:#dce9f2;--other:#f1dde5;background:var(--paper);font-family:Arial,sans-serif;color:var(--accent)}.node rect{fill:var(--wash);stroke:var(--accent);stroke-width:1.5}.node.alt rect{fill:var(--other)}text{fill:var(--ink)}.node text{font-weight:600}.edge{fill:none;stroke:var(--accent);stroke-width:1.5}.edge-label{fill:var(--muted);font-size:14px;paint-order:stroke;stroke:none;stroke-width:0;stroke-linejoin:round}.layer{font-size:13px;fill:var(--muted);letter-spacing:2px}@media(prefers-color-scheme:dark){svg{--paper:#263541;--ink:#e7f1f8;--muted:#b3c9d9;--line:#536e80;--accent:#a4cee8;--wash:#344f63;--other:#4e3849}}svg{color:var(--ink)}.node rect,.edge{stroke:var(--ink)}.node text{font-size:16px}.edge-label{fill:var(--ink);font-size:12px;stroke:none}.layer{fill:var(--ink);font-size:11px;letter-spacing:1px}.loop-title{font-size:16px;font-weight:bold}.band{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 6}</style><defs><marker id="pa" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="currentColor"/></marker></defs><text x="22" y="25" style="font-size:18px;font-weight:bold">Miss &amp; Dragon</text><text class="layer" x="22" y="65">01 HUMAN DIRECTION</text><g class="node "><title>Owner</title><rect x="22" y="90" width="144" height="58" rx="5"/><text x="94.0" y="125.0" text-anchor="middle" font-size="18">Owner</text></g><g class="node "><title>Board</title><rect x="194" y="90" width="144" height="58" rx="5"/><text x="266.0" y="125.0" text-anchor="middle" font-size="18">Board</text></g><g class="node "><title>Room</title><rect x="22" y="180" width="144" height="58" rx="5"/><text x="94.0" y="215.0" text-anchor="middle" font-size="18">Room</text></g><g class="node "><title>DM</title><rect x="194" y="180" width="144" height="58" rx="5"/><text x="266.0" y="215.0" text-anchor="middle" font-size="18">DM</text></g><text class="layer" x="22" y="305">02 REVIEW &amp; COORDINATION</text><g class="node "><title>Lead</title><rect x="22" y="335" width="144" height="58" rx="5"/><text x="94.0" y="370.0" text-anchor="middle" font-size="18">Lead</text></g><g class="node alt"><title>Checks</title><rect x="194" y="335" width="144" height="58" rx="5"/><text x="266.0" y="370.0" text-anchor="middle" font-size="18">Checks</text></g><text class="layer" x="22" y="460">03 EXECUTION &amp; FEEDBACK</text><g class="node "><title>Executor</title><rect x="22" y="490" width="144" height="58" rx="5"/><text x="94.0" y="525.0" text-anchor="middle" font-size="18">Executor</text></g><g class="node alt"><title>Watch</title><rect x="194" y="490" width="144" height="58" rx="5"/><text x="266.0" y="525.0" text-anchor="middle" font-size="18">Watch</text></g><rect class="band" x="12" y="640" width="336" height="554" rx="8"/><text class="loop-title" x="30" y="673">RESEARCH LOOP</text><path class="edge" d="M230.0 762V830" marker-end="url(#pa)"/><rect x="274.0" y="785.0" width="52" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="801.0" text-anchor="middle">assign</text><path class="edge" d="M230.0 888V956" marker-end="url(#pa)"/><rect x="267.0" y="911.0" width="66" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="927.0" text-anchor="middle">run work</text><path class="edge" d="M230.0 1014V1082" marker-end="url(#pa)"/><rect x="270.5" y="1037.0" width="59" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="1053.0" text-anchor="middle">outputs</text><path class="edge" d="M136 1111H30V733H136" marker-end="url(#pa)"/><rect x="39.5" y="910" width="87" height="22" fill="var(--paper)"/><text class="edge-label" x="83" y="926" text-anchor="middle">lead review</text><g class="node "><title>Task</title><rect x="136" y="704" width="188" height="58" rx="5"/><text x="230.0" y="739.0" text-anchor="middle" font-size="18">Task</text></g><g class="node "><title>Executor</title><rect x="136" y="830" width="188" height="58" rx="5"/><text x="230.0" y="865.0" text-anchor="middle" font-size="18">Executor</text></g><g class="node "><title>Runs</title><rect x="136" y="956" width="188" height="58" rx="5"/><text x="230.0" y="991.0" text-anchor="middle" font-size="18">Runs</text></g><g class="node "><title>Results</title><rect x="136" y="1082" width="188" height="58" rx="5"/><text x="230.0" y="1117.0" text-anchor="middle" font-size="18">Results</text></g><rect class="band" x="12" y="1240" width="336" height="554" rx="8"/><text class="loop-title" x="30" y="1273">RECOVERY LOOP</text><path class="edge" d="M230.0 1362V1430" marker-end="url(#pa)"/><rect x="263.5" y="1385.0" width="73" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="1401.0" text-anchor="middle">event IDs</text><path class="edge" d="M230.0 1488V1556" marker-end="url(#pa)"/><rect x="274.0" y="1511.0" width="52" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="1527.0" text-anchor="middle">issues</text><path class="edge" d="M230.0 1614V1682" marker-end="url(#pa)"/><rect x="263.5" y="1637.0" width="73" height="22" fill="var(--paper)"/><text class="edge-label" x="300" y="1653.0" text-anchor="middle">follow-up</text><path class="edge" d="M136 1711H30V1333H136" marker-end="url(#pa)"/><rect x="32.5" y="1510" width="101" height="22" fill="var(--paper)"/><text class="edge-label" x="83" y="1526" text-anchor="middle">observe again</text><g class="node alt"><title>Observe</title><rect x="136" y="1304" width="188" height="58" rx="5"/><text x="230.0" y="1339.0" text-anchor="middle" font-size="18">Observe</text></g><g class="node alt"><title>Events</title><rect x="136" y="1430" width="188" height="58" rx="5"/><text x="230.0" y="1465.0" text-anchor="middle" font-size="18">Events</text></g><g class="node alt"><title>Checks</title><rect x="136" y="1556" width="188" height="58" rx="5"/><text x="230.0" y="1591.0" text-anchor="middle" font-size="18">Checks</text></g><g class="node alt"><title>Repair</title><rect x="136" y="1682" width="188" height="58" rx="5"/><text x="230.0" y="1717.0" text-anchor="middle" font-size="18">Repair</text></g><text x="22" y="1828" style="font-size:11px">Blue: work · Pink: checks</text></svg>
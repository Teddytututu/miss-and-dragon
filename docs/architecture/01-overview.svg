<svg class="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" style="--owner:#f3b8cb;--lead:#f4d0ad;--executor:#dfcbed;--program:#c8e6e4;--file:#f3ead7;--ink:#493641;--label:#493641;--muted:#735766;--paper:#fffdfb;" role="img" aria-label="Big Fish chooses direction, Miss plans, Dragon builds"><title>Big Fish chooses direction, Miss plans, Dragon builds</title><defs><style>.map{display:block;width:100%;height:auto;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",sans-serif}.map .node rect{fill:var(--file);stroke:var(--ink);stroke-width:1.2}.map .node text{fill:var(--label);font-size:21px;font-weight:600}.map .node[data-role=owner] rect{fill:var(--owner)}.map .node[data-role=lead] rect{fill:var(--lead)}.map .node[data-role=executor] rect{fill:var(--executor)}.map .node[data-role=program] rect{fill:var(--program)}.map .edge{fill:none;stroke:var(--ink);stroke-width:1.8}.map .caption{fill:var(--ink);font-size:21px}.map .meta{fill:var(--muted);font-size:18px}</style><marker id="arrow-en-1" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g class="node " data-role="owner" role="group" aria-label="Big Fish" data-detail=""><title>Big Fish</title><rect x="40" y="50" width="250" height="90" rx="7"/><text x="165.0" y="101.0" class="" text-anchor="middle">Big Fish</text></g><g class="node " data-role="lead" role="group" aria-label="Miss" data-detail=""><title>Miss</title><rect x="430" y="50" width="250" height="90" rx="7"/><text x="555.0" y="101.0" class="" text-anchor="middle">Miss</text></g><g class="node " data-role="executor" role="group" aria-label="Dragon" data-detail=""><title>Dragon</title><rect x="820" y="50" width="250" height="90" rx="7"/><text x="945.0" y="101.0" class="" text-anchor="middle">Dragon</text></g><path class="edge " d="M290,95 L425,95" marker-end="url(#arrow-en-1)"/><text x="357.5" y="87.0" class="meta" text-anchor="middle">Question</text><path class="edge " d="M680,95 L815,95" marker-end="url(#arrow-en-1)"/><text x="747.5" y="87.0" class="meta" text-anchor="middle">Task</text><text x="165" y="177" class="meta" text-anchor="middle">Direction, budget, models</text><text x="555" y="177" class="meta" text-anchor="middle">Design and review</text><text x="945" y="177" class="meta" text-anchor="middle">Build, run, deliver</text><g class="node " data-role="file" role="group" aria-label="Shared records" data-detail=""><title>Shared records</title><rect x="330" y="250" width="450" height="70" rx="7"/><text x="555.0" y="282.0" class="" text-anchor="middle">Shared</text><text x="555.0" y="300.0" class="" text-anchor="middle">records</text></g><path class="edge " d="M555,140 L555,245" marker-end="url(#arrow-en-1)"/><text x="555" y="360" class="caption" text-anchor="middle">Programs check state; assistants do the research</text></svg>
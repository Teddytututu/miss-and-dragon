<svg class="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" style="--owner:#f3b8cb;--lead:#f4d0ad;--executor:#dfcbed;--program:#c8e6e4;--file:#f3ead7;--ink:#493641;--label:#493641;--muted:#735766;--paper:#fffdfb;" role="img" aria-label="程序发现变化，会话工具叫醒助手"><title>程序发现变化，会话工具叫醒助手</title><defs><style>.map{display:block;width:100%;height:auto;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","Segoe UI",sans-serif}.map .node rect{fill:var(--file);stroke:var(--ink);stroke-width:1.2}.map .node text{fill:var(--label);font-size:21px;font-weight:600}.map .node[data-role=owner] rect{fill:var(--owner)}.map .node[data-role=lead] rect{fill:var(--lead)}.map .node[data-role=executor] rect{fill:var(--executor)}.map .node[data-role=program] rect{fill:var(--program)}.map .edge{fill:none;stroke:var(--ink);stroke-width:1.8}.map .caption{fill:var(--ink);font-size:21px}.map .meta{fill:var(--muted);font-size:18px}</style><marker id="arrow-zh-4" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g class="node " data-role="program" role="group" aria-label="守夜人" data-detail=""><title>守夜人</title><rect x="30" y="60" width="280" height="90" rx="7"/><text x="170.0" y="111.0" class="" text-anchor="middle">守夜人</text></g><g class="node " data-role="program" role="group" aria-label="事件桥选配" data-detail=""><title>事件桥选配</title><rect x="420" y="60" width="280" height="90" rx="7"/><text x="560.0" y="111.0" class="" text-anchor="middle">事件桥选配</text></g><g class="node " data-role="program" role="group" aria-label="会话宿主" data-detail=""><title>会话宿主</title><rect x="810" y="60" width="280" height="90" rx="7"/><text x="950.0" y="111.0" class="" text-anchor="middle">会话宿主</text></g><path class="edge " d="M310,105 L415,105" marker-end="url(#arrow-zh-4)"/><text x="362.5" y="97.0" class="meta" text-anchor="middle">变化事件</text><path class="edge " d="M700,105 L805,105" marker-end="url(#arrow-zh-4)"/><text x="752.5" y="97.0" class="meta" text-anchor="middle">投递事件</text><g class="node " data-role="program" role="group" aria-label="额度巡检建议" data-detail=""><title>额度巡检建议</title><rect x="420" y="255" width="280" height="75" rx="7"/><text x="560.0" y="298.5" class="" text-anchor="middle">额度巡检建议</text></g><path class="edge " d="M700,290 L950,150" marker-end="url(#arrow-zh-4)"/><text x="825.0" y="212.0" class="meta" text-anchor="middle">巡检建议</text><text x="40" y="390" class="caption" text-anchor="start">守夜人观察任务；宿主工具落实叫醒；助手执行工作</text></svg>
acity='.38'/><rect x='843.0' y='36' width='58' height='16' rx='2' fill='url(#stripe)' opacity='.5'/></g><path d='M786 84 Q 793.5 76.0 801 84' fill='none' stroke='#3b2f36' stroke-width='1.6' stroke-linecap='round' marker-end='url(#a)'/><path d='M248.0 122 C 258.0 168, 794 172, 834 126' fill='none' stroke='#c8524a' stroke-width='1.6' stroke-dasharray='6 5'/><g stroke='#c8524a' stroke-width='2.4' stroke-linecap='round'><line x1='533.0' y1='156' x2='549.0' y2='172'/><line x1='549.0' y1='156' x2='533.0' y2='172'/></g><text x='541.0' y='196' text-anchor='middle' font-family="'Segoe Print','Bradley Hand','Comic Sans MS','Chalkboard SE',cursive" font-size='13.5' fill='#c8524a'>old loop: slept right after the event while GPUs sat idle — the wake contract now refuses it</text><path d='M930 34 c -6 -8 -16 -2 -8 6 l 8 7 l 8 -7 c 8 -8 -2 -14 -8 -6z' fill='#d9668f' opacity='.7'/><path d='M18 133 L20 138 L25 140 L20 142 L18 147 L16 142 L11 140 L16 138z' fill='#8f6fd0' opacity='.75'/></svg>
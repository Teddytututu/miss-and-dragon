<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虚构案例中，方法甲在相同计算预算下答对更多题</title><style>
:root{--bg:#f6f1ee;--paper:#fffdfb;--ink:#493641;--muted:#7a6170;--line:#e6d6dc;--accent:#c2477a;--wash:#f6e3ea}

table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0 14px}th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}

</style></head><body><main><header class="top"><h1>虚构案例中，方法甲在相同计算预算下答对更多题</h1><p class="sub">虚构教学数据</p></header><section><h2>相同预算的正确数</h2><p class="claim"><b>40道虚构题中，方法甲答对23道，方法乙答对18道。</b>两种方法各用50次计算，直接生成答对14道。</p><figure><div class="ft">图 1　相同预算的正确数</div><svg viewBox="0 0 760 114" role="img" aria-label="方法甲23、方法乙18、直接生成14"><text x="140" y="21" text-anchor="end" font-size="14" font-weight="700" fill="#493641">方法甲</text><rect x="150" y="4" width="410.0" height="24" rx="4" fill="#c2477a"/><text x="568.0" y="21" font-size="14" font-weight="700" fill="#c2477a">23 题</text><text x="620.0" y="21" font-size="12.5" fill="#7a6170">50次计算</text><text x="140" y="57" text-anchor="end" font-size="14" font-weight="500" fill="#493641">方法乙</text><rect x="150" y="40" width="320.9" height="24" rx="4" fill="#3a6ea5"/><text x="478.9" y="57" font-size="14" font-weight="700" fill="#3a6ea5">18 题</text><text x="530.9" y="57" font-size="12.5" fill="#7a6170">50次计算</text><text x="140" y="93" text-anchor="end" font-size="14" font-weight="500" fill="#493641">直接生成</text><rect x="150" y="76" width="249.6" height="24" rx="4" fill="#bdb3b9"/><text x="407.6" y="93" font-size="14" font-weight="700" fill="#bdb3b9">14 题</text><text x="459.6" y="93" font-size="12.5" fill="#7a6170">10次计算</text></svg></figure><table><thead><tr><th>方法</th><th>正确数</th><th>计算次数</th></tr></thead><tbody><tr><td>方法甲</td><td>23</td><td>50</td></tr><tr><td>方法乙</td><td>18</td><td>50</td></tr><tr><td>直接生成</td><td>14</td><td>10</td></tr></tbody></table></section><section><h2>预算增加时的变化</h2><p class="claim"><b>方法甲在三个预算下均领先方法乙。</b>曲线使用同一组虚构样本。</p><figure><div class="ft">图 2　预算与正确数</div><svg viewBox="0 0 760 290" role="img" aria-label="两种方法随预算增加的虚构曲线"><line x1="56" x2="610" y1="246.0" y2="246.0" stroke="#ead9e0"/><text x="48" y="250.0" text-anchor="end" font-size="11.5" fill="#7a6170">0</text><line x1="56" x2="610" y1="188.5" y2="188.5" stroke="#ead9e0"/><text x="48" y="192.5" text-anchor="end" font-size="11.5" fill="#7a6170">5.75</text><line x1="56" x2="610" y1="131.0" y2="131.0" stroke="#ead9e0"/><text x="48" y="135.0" text-anchor="end" font-size="11.5" fill="#7a6170">11.5</text><line x1="56" x2="610" y1="73.5" y2="73.5" stroke="#ead9e0"/><text x="48" y="77.5" text-anchor="end" font-size="11.5" fill="#7a6170">17.25</text><line x1="56" x2="610" y1="16.0" y2="16.0" stroke="#ead9e0"/><text x="48" y="20.0" text-anchor="end" font-size="11.5" fill="#7a6170">23</text><text x="56.0" y="264" text-anchor="middle" font-size="11.5" fill="#7a6170">10</text><text x="333.0" y="264" text-anchor="middle" font-size="11.5" fill="#7a6170">30</text><text x="610.0" y="264" text-anchor="middle" font-size="11.5" fill="#7a6170">50</text><text x="333.0" y="284" text-anchor="middle" font-size="12.5" fill="#7a6170">计算次数</text><text x="14" y="131.0" font-size="12.5" fill="#7a6170" transform="rotate(-90 14 131.0)" text-anchor="middle">正确数</text><line x1="333.0" x2="333.0" y1="16" y2="246" stroke="#c2477a" stroke-dasharray="4 4"/><text x="338.0" y="28" font-size="12" fill="#c2477a" stroke="#fffdfb" stroke-width="3" paint-order="stroke">中等预算</text><polyline fill="none" stroke-width="2.6" stroke="#c2477a" points="56.0,106.0 333.0,46.0 610.0,16.0"/><text x="618.0" y="20.0" font-size="13" font-weight="700" fill="#c2477a">方法甲</text><polyline fill="none" stroke-width="2.6" stroke="#3a6ea5" points="56.0,106.0 333.0,86.0 610.0,66.0"/><text x="618.0" y="70.0" font-size="13" font-weight="700" fill="#3a6ea5">方法乙</text></svg></figure></section><section><h2>不同题型的逐题胜负</h2><p class="claim"><b>方法甲在甲类题上净胜3题。</b>乙类题两种方法各有胜负。</p><figure><div class="ft">图 3　逐题胜负</div><svg viewBox="0 0 760 114" role="img" aria-label="甲类方法甲赢4输1，乙类各赢2"><line x1="380.0" x2="380.0" y1="4" y2="86" stroke="#7a6170"/><text x="110" y="25" text-anchor="end" font-size="14" font-weight="600" fill="#493641">甲类</text><rect x="350.0" y="8" width="30" height="24" rx="4" fill="#3a6ea5"/><text x="342.0" y="25" text-anchor="end" font-size="13" font-weight="700" fill="#3a6ea5">1</text><rect x="380.0" y="8" width="120" height="24" rx="4" fill="#c2477a"/><text x="508.0" y="25" font-size="13" font-weight="700" fill="#c2477a">4</text><text x="110" y="65" text-anchor="end" font-size="14" font-weight="600" fill="#493641">乙类</text><rect x="320.0" y="48" width="60" height="24" rx="4" fill="#3a6ea5"/><text x="312.0" y="65" text-anchor="end" font-size="13" font-weight="700" fill="#3a6ea5">2</text><rect x="380.0" y="48" width="60" height="24" rx="4" fill="#c2477a"/><text x="448.0" y="65" font-size="13" font-weight="700" fill="#c2477a">2</text><text x="370.0" y="108" text-anchor="end" font-size="13" fill="#3a6ea5">← 方法乙赢的</text><text x="390.0" y="108" font-size="13" fill="#c2477a">方法甲赢的 →</text></svg></figure><dl class="terms"><dt>计算预算</dt><dd>每道题使用的模型计算次数</dd></dl><div class="next"><b>优势是否来自某一种题型？</b><br>增加独立样本，按预先固定的题型分别统计。</div></section></main></body></html>
